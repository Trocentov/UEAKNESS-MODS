<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin</title>
<link rel="stylesheet" href="style.css">
<script>
function login() {
    const user = prompt("Введите ник администратора:");
    const pass = prompt("Введите пароль:");

    const obfUser = "winged".split('').map(c => c.charCodeAt(0)).join(',');
    const obfPass = "142531".split('').map(c => c.charCodeAt(0)).join(',');

    if(user.split('').map(c=>c.charCodeAt(0)).join(',') === obfUser &&
       pass.split('').map(c=>c.charCodeAt(0)).join(',') === obfPass) {
        window.location.href = "admin.html";
    } else {
        alert("Неверные данные!");
    }
}
</script>
</head>
<body>
<h1>Авторизация администратора</h1>
<div class="container">
    <button onclick="login()">Войти</button>
    <a href="index.html" class="button">Вернуться на главную</a>
</div>
</body>
</html>
