<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ueakness Mods - Админ</title>
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body onload="renderBuilds('buildsContainer')">
<h1>Ueakness Mods</h1>
<h2>Администрация</h2>
<div class="container">
    <button id="addBuildBtn" onclick="showAddBuildForm()">Добавить сборку</button>
    <button onclick="window.location.href='builds.html'">Перейти в сборки</button>
    <button onclick="logoutAdmin()">Выйти из админа</button>

    <form id="addBuildForm" style="display:none;" onsubmit="submitAddBuildForm(event)">
        <input id="newTitle" placeholder="Название сборки" required>
        <input id="newPreview" placeholder="Ссылка на превью 1280x720" required>
        <input id="newDescription" placeholder="Описание сборки" required>
        <input id="newDownload" placeholder="Ссылка на скачивание" required>
        <button type="submit">Создать сборку</button>
    </form>

    <div id="buildsContainer"></div>
</div>
</body>
</html>
