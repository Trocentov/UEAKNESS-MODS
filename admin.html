<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка UEAKNESS MODS</title>
<style>
body {
  margin: 0;
  background: #121212;
  color: #eee;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
}
h2 { margin-bottom: 20px; }
.btn {
  padding: 14px 28px;
  background: #1e1e1e;
  color: #fff;
  border: none;
  border-radius: 14px;
  margin: 10px;
  cursor: pointer;
  transition: 0.3s;
  text-decoration: none;
}
.btn:hover {
  background: #fff;
  color: #121212;
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,255,255,0.5);
}
.notice {
  margin-top: 20px;
  font-size: 0.9rem;
  color: #ccc;
}
</style>
</head>
<body>

<h2>Вход администратора</h2>

<!-- Telegram Login Widget -->
<div id="telegram-login-container"></div>

<a href="index.html" class="btn">На главную</a>

<div class="notice">
Если авторизация не срабатывает, используйте Chrome и убедитесь, что Telegram установлен.
</div>

<script>
// Твой Telegram ID
const ADMIN_ID = 761769081;

// Глобальная функция для Telegram Login
function onTelegramAuth(user) {
  console.log("Telegram user:", user); // Для отладки
  if (user && user.id === ADMIN_ID) {
    localStorage.setItem("isAdmin", "1");
    alert("Вы вошли как администратор");
    window.location.href = "builds.html";
  } else {
    alert("Доступ запрещён");
  }
}

// Динамически создаём виджет Telegram
(function(){
  const script = document.createElement('script');
  script.src = "https://telegram.org/js/telegram-widget.js?22";
  script.async = true;
  script.setAttribute("data-telegram-login","AuthorizationUeaknessBot");
  script.setAttribute("data-size","large");
  script.setAttribute("data-userpic","false");
  script.setAttribute("data-request-access","write");
  script.setAttribute("data-onauth","onTelegramAuth");
  document.getElementById('telegram-login-container').appendChild(script);
})();
</script>

</body>
</html>
