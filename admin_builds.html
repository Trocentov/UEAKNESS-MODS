<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сборки - Админка</title>
  <style>
    body {
      background-color:#111;
      color:#eee;
      font-family:Arial, sans-serif;
      padding:20px;
    }
    h1 { text-align:center; margin-bottom:20px; }
    .build {
      display:flex;
      justify-content:space-between;
      align-items:center;
      background-color:#222;
      padding:10px;
      border-radius:8px;
      margin-bottom:15px;
    }
    .build-info { flex:1; margin-left:10px; }
    .build-info h2 { margin-bottom:5px; font-size:1.2rem; }
    .build-info p { margin:0; font-size:0.9rem; color:#aaa; }
    .build-buttons a {
      display:block;
      margin:3px 0;
      padding:5px 10px;
      font-size:0.8rem;
      color:#111;
      background-color:#eee;
      border-radius:5px;
      text-decoration:none;
      text-align:center;
    }
    .build-buttons a:hover { background-color:#fff; }
    img { width:120px; height:67px; object-fit:cover; border-radius:5px; }
    a.button-top {
      display:inline-block;
      margin-bottom:20px;
      padding:10px 20px;
      background-color:#eee;
      color:#111;
      border-radius:8px;
      text-decoration:none;
      font-weight:bold;
    }
    a.button-top:hover { background-color:#fff; }
  </style>
</head>
<body>
  <h1>Список сборок</h1>

  <a class="button-top" href="admin.html">Вернуться в админку</a>

  <!-- Пример одной сборки -->
  <div class="build">
    <img src="https://postimg.cc/TKjxnf25" alt="Preview">
    <div class="build-info">
      <h2>Black—White</h2>
      <p>Описание сборки: текст</p>
      <p style="font-size:0.7rem; color:#666;">Опубликовано: 07.01.2026</p>
    </div>
    <div class="build-buttons">
      <a href="https://t.me/UeaknessMods/4" target="_blank">Скачать</a>
      <a href="edit_build1.html">Редактировать</a>
      <a href="delete_build1.html">Удалить</a>
    </div>
  </div>

  <!-- Можно добавить новые сборки по такому же шаблону -->
</body>
</html>
